<!doctype html>
<html lang="en" data-lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NCSMini - Player de Música NCS</title>
    <link rel="stylesheet" href="style.css" />

    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#000000" />

    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="assets/icon-192.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="512x512"
      href="assets/icon-512.png"
    />
    <link rel="apple-touch-icon" sizes="180x180" href="assets/icon-192.png" />

    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker
          .register("/sw.js")
          .then(function (reg) {
            console.log("Service Worker registrado!", reg);
          })
          .catch(function (err) {
            console.log("Erro ao registrar Service Worker:", err);
          });
      }
    </script>
  </head>

  <script>
    // Service Worker
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker
        .register("/sw.js")
        .then(function (registration) {
          console.log(
            "✅ Service Worker registrado com sucesso!",
            registration,
          );
        })
        .catch(function (error) {
          console.log("❌ Erro ao registrar Service Worker:", error);
        });
    } else {
      console.log("❌ Service Worker não é suportado neste navegador.");
    }
  </script>

  <body>
    <div class="settings-container">
      <button id="settingsBtn" class="settings-btn" aria-label="Settings">
        ⚙️
      </button>
      <div id="settingsMenu" class="settings-menu">
        <div class="settings-item lang-option">
          <span class="lang-text">Language ▾</span>
          <div class="lang-dropdown">
            <div data-lang="en">English</div>
            <div data-lang="pt">Português</div>
            <div data-lang="es">Español</div>
            <div data-lang="ja">日本語</div>
          </div>
        </div>
        <div class="settings-item" id="themeToggle">
          <span class="theme-text">Theme</span>
          <span id="themeIcon">☀️</span>
        </div>
        <div class="settings-item" id="fullscreenToggle">
          <span class="fullscreen-text">Fullscreen</span>
          <span id="fullscreenIcon">⛶</span>
        </div>
      </div>
    </div>

    <h1 class="welcome">
      <span class="welcome-text"></span>
      <span class="welcome-icon"></span>
    </h1>

    <main class="player-container">
      <div class="search-container">
        <input
          type="text"
          id="searchInput"
          placeholder="Search songs or artists..."
        />
        <div id="searchResults" class="search-results"></div>
      </div>

      <div class="album">
        <img id="albumCover" src="" alt="Capa do álbum" />
      </div>

      <div class="music-title-wrapper">
        <div class="music-title">Música</div>
        <button
          class="download-main-btn"
          id="downloadMainBtn"
          title="Baixar esta música"
        >
          ⬇️
        </button>
      </div>

      <div class="download-all-container">
        <button class="download-all-btn" id="downloadAllBtn">
          📥 <span class="download-all-text">Download All</span>
          <span class="count" id="downloadCount">0</span>
        </button>
      </div>
      <div class="nav">
        <button class="prev" aria-label="Anterior">⏮</button>
        <button class="play" aria-label="Play/Pause">▶</button>
        <button class="next" aria-label="Próxima">⏭</button>
      </div>

      <p class="copyright">
        <span class="copyright-text">All audio tracks provided by</span>
        <a href="https://ncs.io" target="_blank"><strong>NCS</strong></a>
      </p>
    </main>

    <div class="volume-control-wrapper">
      <button class="vol-icon" aria-label="Volume">🔊</button>
      <div class="volume-slider-container">
        <input
          type="range"
          class="volume-slider"
          min="0"
          max="100"
          value="80"
        />
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
